name: Backend tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: atlas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Integration tests use Postgres when this is set; Functional/Unit stay InMemory/mocked.
      ConnectionStrings__AtlasDb: Host=localhost;Port=5432;Database=atlas;Username=atlas;Password=change-me

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore src/Atlas.sln

      - name: Test
        run: dotnet test src/Atlas.sln --no-restore --verbosity normal
