name: Umbrella Blazor CI

on:
  push:
    branches: [cursor/blazor-wasm-frontend-82c4]
  pull_request:
    branches: [cursor/blazor-wasm-frontend-82c4]

permissions:
  contents: read

jobs:
  blazor-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore src/frontend/Atlas.Ui/Atlas.Ui.csproj

      - name: Build Blazor WASM
        run: dotnet build src/frontend/Atlas.Ui/Atlas.Ui.csproj --no-restore -c Release

  blazor-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish Blazor WASM
        run: dotnet publish src/frontend/Atlas.Ui/Atlas.Ui.csproj -c Release -o /tmp/atlas-ui-publish

  openapi-drift:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: atlas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ConnectionStrings__AtlasDb: Host=localhost;Port=5432;Database=atlas;Username=atlas;Password=change-me
      ASPNETCORE_ENVIRONMENT: Development

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore API
        run: dotnet restore src/backend/Api/Atlas.Api/Atlas.Api.csproj

      - name: OpenAPI drift check
        run: bash scripts/check-openapi-drift.sh

  playwright-e2e:
    runs-on: ubuntu-latest
    needs: [blazor-build, blazor-publish, openapi-drift]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: atlas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ConnectionStrings__AtlasDb: Host=localhost;Port=5432;Database=atlas;Username=atlas;Password=change-me
      ASPNETCORE_ENVIRONMENT: Development
      ATLAS_SEED_DEMO: "true"
      OpenAI__ApiKey: ""
      Cors__AllowedOrigins__0: http://localhost:5173
      Cors__AllowedOrigins__1: http://127.0.0.1:5173
      API_BASE_URL: http://localhost:5012
      PLAYWRIGHT_BASE_URL: http://localhost:5173

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Restore API
        run: dotnet restore src/backend/Api/Atlas.Api/Atlas.Api.csproj

      - name: Start API (demo seed)
        run: |
          nohup dotnet run --project src/backend/Api/Atlas.Api/Atlas.Api.csproj --launch-profile http > /tmp/atlas-api.log 2>&1 &
          echo $! > /tmp/atlas-api.pid
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:5012/health >/dev/null 2>&1; then
              echo "API healthy"
              exit 0
            fi
            sleep 2
          done
          echo "API failed to become healthy"
          cat /tmp/atlas-api.log || true
          exit 1

      - name: Install Playwright deps
        working-directory: tests/e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: tests/e2e
        run: npx playwright install --with-deps chromium

      - name: Run Playwright e2e
        working-directory: tests/e2e
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-umbrella
          path: tests/e2e/playwright-report/
          retention-days: 7

      - name: Stop API
        if: always()
        run: |
          if [ -f /tmp/atlas-api.pid ]; then
            kill "$(cat /tmp/atlas-api.pid)" || true
          fi
